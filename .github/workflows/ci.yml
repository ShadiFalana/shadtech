name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shadtech
          POSTGRES_PASSWORD: shadtech
          POSTGRES_DB: shadtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadtech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format:check

      - name: Backend tests
        env:
          DATABASE_URL: postgresql://shadtech:shadtech@localhost:5432/shadtech?schema=public
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          cd backend
          npx prisma migrate deploy
          npx prisma db seed
          npm test
